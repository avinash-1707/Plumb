services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nodeweb
      POSTGRES_PASSWORD: nodeweb
      POSTGRES_DB: nodeweb
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodeweb -d nodeweb"]
      interval: 2s
      timeout: 3s
      retries: 15
