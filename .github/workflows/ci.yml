name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.20.0 is the engines floor: the first 22.x where path.matchesGlob and fs.glob are both stable.
        node: ["22.20.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The golden map test extracts from the example, which needs its own dependencies installed.
      - run: pnpm --dir examples/node-web install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The full /plumb-init against a fresh copy of the example: discovery, profile, verify skill, self-proof, gate,
  # hook, and a second run that must change nothing. Headless Claude Code costs a few dollars per run, so it runs on
  # pull requests only, and only where the ANTHROPIC_API_KEY secret exists (not on forks).
  e2e-init:
    name: e2e /plumb-init on the example
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLUMB_E2E_PLAYWRIGHT_DEPS: "1"
    steps:
      - name: Skip without an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "no ANTHROPIC_API_KEY secret; skipping"; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.run == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.run == 'true'
        with:
          node-version: "24"
          cache: pnpm
      - if: steps.key.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - if: steps.key.outputs.run == 'true'
        run: scripts/e2e-init.sh "$RUNNER_TEMP/plumb-e2e"
      - name: Keep the transcripts and evidence
        if: always() && steps.key.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-init
          path: |
            ${{ runner.temp }}/plumb-e2e/*.jsonl
            ${{ runner.temp }}/plumb-e2e/*.err
            ${{ runner.temp }}/plumb-e2e/app/.plumb/evidence/
          if-no-files-found: ignore
